[build]
  publish = "."

[[redirects]]
  from = "/vindicator/*"
  to = "https://vincent.vandenbraken.com/vindicator/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
